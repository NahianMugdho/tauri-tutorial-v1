# GitHub Pages এ স্বয়ংক্রিয় deploy। main ব্রাঞ্চে push করলেই চলবে।
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Build
        run: npm run build
        env:
          # রিপোর নাম থেকে base নিজে তৈরি: /রিপো-নাম/
          VITE_BASE: /${{ github.event.repository.name }}/
      # রিফ্রেশ করলে 404 না আসতে: index.html কে 404.html হিসেবেও রাখো
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
